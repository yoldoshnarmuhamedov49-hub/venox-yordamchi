# Render blueprint for Venox Yordamchi (pure Telegram bot, no web server)
# Dashboard: https://dashboard.render.com/blueprints

databases: []

services:
  # 24/7 Telegram bot — all features run through inline keyboards.
  - type: worker
    name: venox-yordamchi
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "8527026238"
      - key: ADMIN_USERNAME
        value: "THE_VENOX"
      - key: PAYMENT_CARD
        value: "5614 6830 1549 1525"
      - key: DATABASE_PATH
        value: "data/venox.db"
      - key: LOG_LEVEL
        value: "INFO"
