# Render blueprint for Venox Yordamchi
# Dashboard: https://dashboard.render.com/blueprints
# Create a new Blueprint and point it at this repository (render.yaml is auto-detected).

databases: []

services:
  # 24/7 Telegram bot — long polling background worker.
  - type: worker
    name: venox-yordamchi-bot
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "8527026238"
      - key: ADMIN_USERNAME
        value: "THE_VENOX"
      - key: PAYMENT_CARD
        value: "5614 6830 1549 1525"
      # Public URL of the miniapp web service below (Render -> Web Service -> URL).
      - key: MINI_APP_URL
        sync: false
      - key: DATABASE_PATH
        value: "data/venox.db"
      - key: LOG_LEVEL
        value: "INFO"

  # Web Mini App: template catalog + published bot pages.
  - type: web
    name: venox-yordamchi-miniapp
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py --webapp"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: "data/venox.db"
      - key: LOG_LEVEL
        value: "INFO"
